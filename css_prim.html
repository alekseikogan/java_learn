<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox vs Grid</title>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }

  h2 {
    margin-top: 40px;
  }

  /* Flexbox example */
  .flex-container {
    display: flex;
    gap: 10px;
    background: #eee;
    padding: 10px;
  }

  .flex-item {
    background: lightblue;
    padding: 20px;
    flex: 1; /* элементы растягиваются одинаково */
    text-align: center;
  }

  /* Grid example */
  .grid-container {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr; /* 3 колонки, средняя шире */
    gap: 10px;
    background: #eee;
    padding: 10px;
  }

  .grid-item {
    background: lightgreen;
    padding: 20px;
    text-align: center;
  }
</style>
</head>
<body>

<h2>Flexbox (одномерная компоновка)</h2>
<div class="flex-container">
  <div class="flex-item">Item 1</div>
  <div class="flex-item">Item 2</div>
  <div class="flex-item">Item 3</div>
</div>

<h2>Grid (двумерная компоновка)</h2>
<div class="grid-container">
  <div class="grid-item">Item 1</div>
  <div class="grid-item">Item 2</div>
  <div class="grid-item">Item 3</div>
  <div class="grid-item">Item 4</div>
</div>

</body>
</html>
